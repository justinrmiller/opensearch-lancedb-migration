[project]
name = "opensearch-lancedb-migration"
version = "0.1.0"
description = "Compare and contrast OpenSearch and LanceDB for vector search with SigLIP 2 image embeddings"
requires-python = ">=3.10"
dependencies = [
    "transformers>=4.45.0",
    "torch>=2.0.0",
    "pillow>=10.0.0",
    "opensearch-py>=2.4.0",
    "lancedb>=0.20.0",
    "pyarrow>=15.0.0",
    "numpy>=1.26.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "streamlit>=1.38.0",
    "huggingface_hub>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
]
